pod:
  kind: Deployment
  replicas: 1

secret:
  existingSecret: authelia-credentials
certificates:
  existingSecret: ldap-ca
persistence:
  enabled: true
ingress:
  tls:
    enabled: true

configMap:
  password_policy:
    standard:
      enabled: true
      min_length: 12
  authentication_backend:
    ldap:
      enabled: true
      implementation: custom
      address: ldap://openldap:389
      start_tls: true
      base_dn: dc=example,dc=org
      additional_users_dn: ou=users
      users_filter: '(&({username_attribute}={input})(objectClass=inetOrgPerson))'
      additional_groups_dn: ou=groups
      groups_filter: '(&(member={dn})(objectClass=groupOfNames))'
      user: cn=management,ou=services,dc=example,dc=org
      attributes:
        distinguished_name: entryDN
        username: uid
        display_name: displayName
        mail: mail
        group_name: cn
  session:
    cookies:
      - domain: ldap.example.test
        subdomain: auth
  storage:
    local:
      enabled: true
  notifier:
    filesystem:
      enabled: true
  access_control:
    default_policy: deny
    rules:
      - domain: app.ldap.example.test
        policy: one_factor
        subject: group:users
