replicaCount: 1
revisionHistoryLimit: 10

automountServiceAccountToken: false

clusterDomain: cluster.local

image:
  repository: osixia/openldap
  tag: 2.6.15-beta
  pullPolicy: IfNotPresent

previousImage:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 911

securityContext:
  runAsNonRoot: true
  runAsUser: 911
  runAsGroup: 911

service:
  type: ClusterIP
  annotations: {}
  ldapPort: 389
  ldapsPort: 636

headlessService:
  annotations: {}

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

podAntiAffinity:
  enabled: true
  type: preferred
  weight: 100
  topologyKey: kubernetes.io/hostname

updateStrategy:
  type: RollingUpdate

terminationGracePeriodSeconds: 60

extraEnv: []

extraEnvSecret:
  existingSecret: ""
  env: {}

bootstrapEnvSecret:
  existingSecret: ""
  env: {}

tlsSecret:
  existingSecret: ""
  keys:
    cert: tls.crt
    key: tls.key
    ca: ca.crt

openldap:
  nofile: "8192"
  debugLevel: "256"

  tlsReload:
    enabled: false
    resources: {}

  protocols:
    ldap:
      enabled: true
      port: 3890
    ldaps:
      enabled: true
      port: 6360
    ldapi:
      enabled: true

  preUpgrade:
    enabled: true

  upgrade:
    force: false
    migrationLevel: minor

  bootstrap:
    organization: "Example Org"
    suffix: "dc=example,dc=org"

    modules: []

    schemas:
      - core.ldif
      - cosine.ldif
      - inetorgperson.ldif
      - rfc2307bis.ldif

    global:
      sizeLimit: 500
      timeLimit: 120
      idleTimeout: 3600
      writeTimeout: 0
      connMaxPending: 100
      connMaxPendingAuth: 1000
      sockbufMaxIncoming: 262143
      sockbufMaxIncomingAuth: 4194303

    frontend:
      passwordHash: "{ARGON2}"

    config:
      rootDnPrefix: "cn=admin"
      rootPasswordHashed: ""

    database:
      maxSize: "10737418240"
      lastBind:
        enabled: false
        precision: 3600
      rootDnPrefix: "cn=admin"
      rootPasswordHashed: ""
      readonly:
        enabled: false
        dnPrefix: "cn=readonly"
        passwordHashed: ""

    monitor:
      enabled: false
      readonly:
        enabled: false
        dnPrefix: "cn=readonly-monitor"
        passwordHashed: ""

    auditlog:
      enabled: false
      file: /var/log/openldap/audit.ldif

    tls:
      enabled: false
      required: false
      verifyClient: allow
      protocolMin: "3.4"

    refint:
      enabled: false
      attributes: "member uniqueMember manager owner"
      nothingDnPrefix: ""

    ppolicy:
      enabled: false
      hashClearText: true
      useLockout: true
      checkModule: ""
      groupDnPrefix: "ou=Policies"
      default:
        policyDnPrefix: "cn=default"
        minLength: 12
        checkQuality: 1
        inHistory: 12
        allowUserChange: true
        safeModify: true
        mustChange: false
        minAge: 0
        maxFailure: 5
        failureCountInterval: 300
        lockout: true
        lockoutDuration: 900
        minDelay: 0
        maxDelay: 0
        maxAge: 7776000
        maxIdle: 0
        expireWarning: 1209600
        graceAuthNLimit: 3

    unique:
      enabled: false
      uris: "ldap:///?uid?sub ldap:///?mail?sub"

    memberof:
      enabled: false
      groupObjectClass: groupOfNames
      memberAttribute: member
      memberOfAttribute: memberOf
      addCheck: true
      dangling: ignore

    replication:
      mode: auto
      allowReplicaCountChange: false
      hosts: []
      syncprovCheckpoint: "100 10"
      dataReadonlyDnPrefix: "cn=replicator"
      # Required when replication is enabled; may also be supplied via bootstrapEnvSecret.
      dataReadonlyPassword: ""
      protocol: ldap
      tls:
        enabled: false
        syncRepl: "starttls=critical tls_reqcert=demand"

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  storageClass: ""
  conf:
    size: 1Gi
    volume: {}
  data:
    size: 8Gi
    volume: {}
  backups:
    size: 8Gi
    volume: {}
  auditlog:
    size: 1Gi
    volume: {}

customModulesVolume: {}
customSchemasVolume: {}

bootstrapCustomConfigLdifVolume: {}
bootstrapCustomDataLdifVolume: {}

extraVolumes: []
extraVolumeMounts: []
topologySpreadConstraints: []

livenessProbe:
  enabled: true
  tcpSocket:
    port: ldap
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  enabled: true
  tcpSocket:
    port: ldap
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

startupProbe:
  enabled: false
  tcpSocket:
    port: ldap
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # Integer (including 0) or percentage; empty uses minAvailable instead.
  maxUnavailable: ""

backupCronJob:
  enabled: false
  schedule: "15 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  command:
    - /bin/sh
    - -ec
    - >-
      container --exec openldap --skip-process &&
      container run -- openldap-ctl backup "openldap-cron-$(date -I)-${OPENLDAP_VERSION}" --clean 15 --clean-prefix openldap-cron-
  resources: {}
