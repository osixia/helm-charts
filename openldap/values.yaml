replicaCount: 1

clusterDomain: cluster.local

image:
  repository: osixia/openldap
  tag: 2.6.10-alpha
  pullPolicy: IfNotPresent

previousImage:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 911

securityContext:
  runAsNonRoot: true
  runAsUser: 911
  runAsGroup: 911

service:
  type: ClusterIP
  annotations: {}
  ldapPort: 389
  ldapsPort: 636

headlessService:
  annotations: {}

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

podAntiAffinity:
  enabled: true
  type: preferred
  weight: 100
  topologyKey: kubernetes.io/hostname

updateStrategy:
  type: RollingUpdate

terminationGracePeriodSeconds: 60

extraEnv: []

extraEnvSecret:
  existingSecret: ""
  env: {}

bootstrapEnvSecret:
  existingSecret: ""
  env: {}

tlsSecret:
  existingSecret: ""
  keys:
    cert: tls.crt
    key: tls.key
    ca: ca.crt

openldap:
  nofile: "8192"
  debugLevel: "256"

  protocols:
    ldap:
      enabled: true
      port: 3890
    ldaps:
      enabled: true
      port: 6360
    ldapi:
      enabled: true

  preUpgrade:
    enabled: true

  upgrade:
    force: false
    migrationLevel: minor

  bootstrap:
    organization: "Example Org"
    suffix: "dc=example,dc=org"

    modules:
      - back_mdb.so
      - argon2.so
      - ppolicy.so
      - unique.so
      - refint.so
      - memberof.so
      - syncprov.so

    schemas:
      - core.ldif
      - cosine.ldif
      - inetorgperson.ldif
      - rfc2307bis.ldif

    global:
      sizeLimit: 500
      timeLimit: 120
      idleTimeout: 3600

    frontend:
      passwordHash: "{ARGON2}"

    config:
      rootDnPrefix: "cn=admin"
      rootPasswordHashed: ""

    database:
      maxSize: "10737418240"
      rootDnPrefix: "cn=admin"
      rootPasswordHashed: ""
      readonly:
        enabled: false
        dnPrefix: "cn=readonly"
        passwordHashed: ""

    monitor:
      enabled: false
      readonly:
        enabled: false
        dnPrefix: "cn=readonly-monitor"
        passwordHashed: ""

    tls:
      enabled: false
      required: false
      verifyClient: allow
      protocolMin: "3.4"

    refint:
      enabled: false
      attributes: "member uniqueMember manager owner"

    ppolicy:
      enabled: false
      hashClearText: true
      useLockout: true
      checkModule: ""
      groupDnPrefix: "ou=Policies"
      default:
        policyDnPrefix: "cn=default"
        minLength: 12
        checkQuality: 0
        inHistory: 12
        allowUserChange: true
        safeModify: true
        mustChange: false
        minAge: 0
        maxFailure: 5
        failureCountInterval: 300
        lockout: true
        lockoutDuration: 900
        maxAge: 7776000
        expireWarning: 1209600
        graceAuthNLimit: 3

    unique:
      enabled: false
      uris: "ldap:///?uid?sub ldap:///?mail?sub"

    memberof:
      enabled: false
      groupObjectClass: groupOfNames
      memberAttribute: member
      memberOfAttribute: memberOf
      addCheck: true
      dangling: ignore

    replication:
      mode: auto
      hosts: []
      syncprovCheckpoint: "100 10"
      dataReadonlyDnPrefix: "cn=replicator"
      dataReadonlyPassword: ""
      protocol: ldap
      tls:
        enabled: false
        syncRepl: "starttls=critical tls_reqcert=demand"

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  storageClass: ""
  conf:
    size: 1Gi
  data:
    size: 8Gi
  backups:
    size: 8Gi

customModulesVolume: {}
customSchemasVolume: {}

bootstrapCustomConfigLdifVolume: {}
bootstrapCustomDataLdifVolume: {}

extraVolumes: []
extraVolumeMounts: []

livenessProbe:
  enabled: true
  tcpSocket:
    port: ldap
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  enabled: true
  tcpSocket:
    port: ldap
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

backupCronJob:
  enabled: false
  schedule: "15 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  command:
    - /bin/sh
    - -ec
    - container run -- openldap-ctl backup "$(date -I)-${OPENLDAP_VERSION}-openldap-cron" --clean 15
  resources: {}

phpldapadmin:
  enabled: false
  app:
    ldap:
      # Typically: <release>-openldap.<namespace>.svc.cluster.local
      host: ""
      port: 389
      connection: ldap
      ssl: false
      tls: false
