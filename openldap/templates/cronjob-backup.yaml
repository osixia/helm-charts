{{- if .Values.backupCronJob.enabled }}
{{- if and (not .Values.persistence.enabled) (or (empty .Values.persistence.conf.volume) (empty .Values.persistence.data.volume) (empty .Values.persistence.backups.volume)) }}
{{- fail "backupCronJob.enabled requires persistence.enabled=true or custom volumes for conf, data and backups" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "openldap.fullname" . }}-backup
  labels:
    {{- include "openldap.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backupCronJob.schedule | quote }}
  successfulJobsHistoryLimit: {{ .Values.backupCronJob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backupCronJob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "openldap.name" . }}
            app.kubernetes.io/instance: {{ printf "%s-backup" .Release.Name | quote }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "openldap.serviceAccountName" . }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      statefulset.kubernetes.io/pod-name: {{ printf "%s-0" (include "openldap.fullname" .) | quote }}
                  topologyKey: kubernetes.io/hostname
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: backup
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                {{- toYaml .Values.backupCronJob.command | nindent 16 }}
              envFrom:
                - configMapRef:
                    name: {{ include "openldap.fullname" . }}-env
                - secretRef:
                    name: {{ include "openldap.secretName" . }}
                    optional: true
              {{- with .Values.extraEnv }}
              env:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.backupCronJob.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: conf
                  mountPath: /etc/openldap/slapd.d
                - name: data
                  mountPath: /var/lib/openldap/openldap-data
                - name: backups
                  mountPath: /var/lib/openldap/openldap-backups
                {{- if .Values.tlsSecret.existingSecret }}
                - name: tls
                  mountPath: /container/services/openldap/assets/certs
                  readOnly: true
                {{- end }}
                {{- if .Values.customModulesVolume }}
                - name: custom-modules
                  mountPath: /container/services/openldap/assets/module
                  readOnly: true
                {{- end }}
                {{- if .Values.customSchemasVolume }}
                - name: custom-schemas
                  mountPath: /container/services/openldap/assets/schema
                  readOnly: true
                {{- end }}
                {{- with .Values.extraVolumeMounts }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
          volumes:
            {{- range $name := list "conf" "data" "backups" }}
            - name: {{ $name }}
              {{- with (index $.Values.persistence $name).volume }}
              {{- toYaml . | nindent 14 }}
              {{- else }}
              persistentVolumeClaim:
                claimName: {{ $name }}-{{ include "openldap.fullname" $ }}-0
              {{- end }}
            {{- end }}
            {{- if .Values.tlsSecret.existingSecret }}
            - name: tls
              secret:
                secretName: {{ include "openldap.tlsSecretName" . }}
                items:
                  - key: {{ .Values.tlsSecret.keys.cert }}
                    path: tls.crt
                  - key: {{ .Values.tlsSecret.keys.key }}
                    path: tls.key
                  - key: {{ .Values.tlsSecret.keys.ca }}
                    path: ca.crt
            {{- end }}
            {{- if .Values.customModulesVolume }}
            - name: custom-modules
              {{- toYaml .Values.customModulesVolume | nindent 14 }}
            {{- end }}
            {{- if .Values.customSchemasVolume }}
            - name: custom-schemas
              {{- toYaml .Values.customSchemasVolume | nindent 14 }}
            {{- end }}
            {{- with .Values.extraVolumes }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- end }}
