{{- if .Values.backupCronJob.enabled }}
{{- if and (not .Values.persistence.enabled) (or (empty .Values.persistence.conf.volume) (empty .Values.persistence.data.volume) (empty .Values.persistence.backups.volume)) }}
{{- fail "backupCronJob.enabled requires persistence.enabled=true or custom volumes for conf, data and backups" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "openldap.fullname" . }}-backup
  labels:
    {{- include "openldap.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backupCronJob.schedule | quote }}
  successfulJobsHistoryLimit: {{ .Values.backupCronJob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backupCronJob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "openldap.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "openldap.serviceAccountName" . }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: backup
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                {{- toYaml .Values.backupCronJob.command | nindent 16 }}
              envFrom:
                - configMapRef:
                    name: {{ include "openldap.fullname" . }}-env
                - secretRef:
                    name: {{ include "openldap.secretName" . }}
                    optional: true
              {{- with .Values.extraEnv }}
              env:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.backupCronJob.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: conf
                  mountPath: /etc/openldap/slapd.d
                - name: data
                  mountPath: /var/lib/openldap/openldap-data
                - name: backups
                  mountPath: /var/lib/openldap/openldap-backups
          volumes:
            {{- range $name := list "conf" "data" "backups" }}
            - name: {{ $name }}
              {{- with (index $.Values.persistence $name).volume }}
              {{- toYaml . | nindent 14 }}
              {{- else }}
              persistentVolumeClaim:
                claimName: {{ $name }}-{{ include "openldap.fullname" $ }}-0
              {{- end }}
            {{- end }}
{{- end }}
