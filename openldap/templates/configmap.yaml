{{- $replicationEnabled := eq (include "openldap.replicationEnabled" .) "true" -}}
{{- if and $replicationEnabled (not .Values.openldap.bootstrap.replication.hosts) (lt (int .Values.replicaCount) 2) }}
{{- fail "bootstrap.replication.mode=enabled requires replicaCount >= 2 or bootstrap.replication.hosts" }}
{{- end }}
{{- if $replicationEnabled }}
{{- $protocol := .Values.openldap.bootstrap.replication.protocol }}
{{- if eq $protocol "ldap" }}
{{- if not .Values.openldap.protocols.ldap.enabled }}
{{- fail "bootstrap.replication.protocol=ldap requires protocols.ldap.enabled=true" }}
{{- end }}
{{- else if eq $protocol "ldaps" }}
{{- if not .Values.openldap.protocols.ldaps.enabled }}
{{- fail "bootstrap.replication.protocol=ldaps requires protocols.ldaps.enabled=true" }}
{{- end }}
{{- else }}
{{- fail "bootstrap.replication.protocol must be one of: ldap, ldaps" }}
{{- end }}
{{- end }}
{{- if and .Release.IsUpgrade .Values.openldap.preUpgrade.enabled (not .Values.previousImage.tag) }}
{{- fail "previousImage.tag must be set during upgrades so openldap-pre-upgrade runs with the previous image version" }}
{{- end }}
{{- if not (has .Values.openldap.upgrade.migrationLevel (list "patch" "minor" "major")) }}
{{- fail "upgrade.migrationLevel must be one of: patch, minor, major" }}
{{- end }}
{{- if and .Values.livenessProbe.enabled (not .Values.openldap.protocols.ldap.enabled) (eq ((.Values.livenessProbe | dig "tcpSocket" "port" "") | toString) "ldap") }}
{{- fail "livenessProbe uses named port 'ldap' but protocols.ldap.enabled=false; set livenessProbe.tcpSocket.port to 'ldaps' or disable the probe" }}
{{- end }}
{{- if and .Values.readinessProbe.enabled (not .Values.openldap.protocols.ldap.enabled) (eq ((.Values.readinessProbe | dig "tcpSocket" "port" "") | toString) "ldap") }}
{{- fail "readinessProbe uses named port 'ldap' but protocols.ldap.enabled=false; set readinessProbe.tcpSocket.port to 'ldaps' or disable the probe" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openldap.fullname" . }}-env
  labels:
    {{- include "openldap.labels" . | nindent 4 }}
data:
  OPENLDAP_NOFILE: {{ .Values.openldap.nofile | quote }}
  OPENLDAP_DEBUG_LEVEL: {{ .Values.openldap.debugLevel | quote }}
  OPENLDAP_UPGRADE_FORCE: {{ ternary "true" "false" .Values.openldap.upgrade.force | quote }}
  OPENLDAP_UPGRADE_MIGRATION_LEVEL: {{ .Values.openldap.upgrade.migrationLevel | quote }}
  {{- if not (and $replicationEnabled (not .Values.openldap.bootstrap.replication.hosts)) }}
  OPENLDAP_URLS: {{ include "openldap.urls" . | quote }}
  {{- end }}
