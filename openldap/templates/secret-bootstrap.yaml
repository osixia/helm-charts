{{- $replicationEnabled := eq (include "openldap.replicationEnabled" .) "true" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openldap.fullname" . }}-bootstrap-secret
  labels:
    {{- include "openldap.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENLDAP_BOOTSTRAP_ORGANIZATION: {{ .Values.openldap.bootstrap.organization | quote }}
  OPENLDAP_BOOTSTRAP_SUFFIX: {{ .Values.openldap.bootstrap.suffix | quote }}
  OPENLDAP_BOOTSTRAP_MODULES: {{ join " " .Values.openldap.bootstrap.modules | quote }}
  OPENLDAP_BOOTSTRAP_SCHEMAS: {{ join " " .Values.openldap.bootstrap.schemas | quote }}
  OPENLDAP_BOOTSTRAP_GLOBAL_SIZE_LIMIT: {{ .Values.openldap.bootstrap.global.sizeLimit | quote }}
  OPENLDAP_BOOTSTRAP_GLOBAL_TIME_LIMIT: {{ .Values.openldap.bootstrap.global.timeLimit | quote }}
  OPENLDAP_BOOTSTRAP_GLOBAL_IDLE_TIMEOUT: {{ .Values.openldap.bootstrap.global.idleTimeout | quote }}
  OPENLDAP_BOOTSTRAP_CONFIG_PASSWORD_HASH: {{ .Values.openldap.bootstrap.frontend.passwordHash | quote }}
  OPENLDAP_BOOTSTRAP_CONFIG_ROOT_DN: {{ printf "%s,cn=config" .Values.openldap.bootstrap.config.rootDnPrefix | quote }}
  OPENLDAP_BOOTSTRAP_CONFIG_ROOT_PASSWORD_HASHED: {{ .Values.openldap.bootstrap.config.rootPasswordHashed | quote }}
  OPENLDAP_BOOTSTRAP_DATA_DATABASE_MAX_SIZE: {{ .Values.openldap.bootstrap.database.maxSize | quote }}
  OPENLDAP_BOOTSTRAP_DATA_ROOT_DN: {{ printf "%s,%s" .Values.openldap.bootstrap.database.rootDnPrefix .Values.openldap.bootstrap.suffix | quote }}
  OPENLDAP_BOOTSTRAP_DATA_ROOT_PASSWORD_HASHED: {{ .Values.openldap.bootstrap.database.rootPasswordHashed | quote }}
  OPENLDAP_BOOTSTRAP_DATA_READONLY: {{ ternary "true" "false" .Values.openldap.bootstrap.database.readonly.enabled | quote }}
  OPENLDAP_BOOTSTRAP_DATA_READONLY_DN: {{ printf "%s,%s" .Values.openldap.bootstrap.database.readonly.dnPrefix .Values.openldap.bootstrap.suffix | quote }}
  OPENLDAP_BOOTSTRAP_DATA_READONLY_PASSWORD_HASHED: {{ .Values.openldap.bootstrap.database.readonly.passwordHashed | quote }}
  OPENLDAP_BOOTSTRAP_MONITOR_ENABLED: {{ ternary "true" "false" .Values.openldap.bootstrap.monitor.enabled | quote }}
  OPENLDAP_BOOTSTRAP_MONITOR_READONLY: {{ ternary "true" "false" .Values.openldap.bootstrap.monitor.readonly.enabled | quote }}
  OPENLDAP_BOOTSTRAP_MONITOR_READONLY_DN: {{ printf "%s,%s" .Values.openldap.bootstrap.monitor.readonly.dnPrefix .Values.openldap.bootstrap.suffix | quote }}
  OPENLDAP_BOOTSTRAP_MONITOR_READONLY_PASSWORD_HASHED: {{ .Values.openldap.bootstrap.monitor.readonly.passwordHashed | quote }}
  OPENLDAP_BOOTSTRAP_TLS: {{ ternary "true" "false" .Values.openldap.bootstrap.tls.enabled | quote }}
  OPENLDAP_BOOTSTRAP_TLS_VERIFY_CLIENT: {{ .Values.openldap.bootstrap.tls.verifyClient | quote }}
  OPENLDAP_BOOTSTRAP_TLS_PROTOCOL_MIN: {{ .Values.openldap.bootstrap.tls.protocolMin | quote }}
  OPENLDAP_BOOTSTRAP_TLS_REQUIRED: {{ ternary "true" "false" .Values.openldap.bootstrap.tls.required | quote }}
  OPENLDAP_BOOTSTRAP_REFINT: {{ ternary "true" "false" .Values.openldap.bootstrap.refint.enabled | quote }}
  OPENLDAP_BOOTSTRAP_REFINT_ATTRIBUTES: {{ .Values.openldap.bootstrap.refint.attributes | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY: {{ ternary "true" "false" .Values.openldap.bootstrap.ppolicy.enabled | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY_HASH_CLEAR_TEXT: {{ ternary "true" "false" .Values.openldap.bootstrap.ppolicy.hashClearText | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY_USE_LOCKOUT: {{ ternary "true" "false" .Values.openldap.bootstrap.ppolicy.useLockout | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY_CHECK_MODULE: {{ .Values.openldap.bootstrap.ppolicy.checkModule | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY_GROUP_DN: {{ printf "%s,%s" .Values.openldap.bootstrap.ppolicy.groupDnPrefix .Values.openldap.bootstrap.suffix | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY_DEFAULT_POLICY_DN: {{ printf "%s,%s,%s" .Values.openldap.bootstrap.ppolicy.default.policyDnPrefix .Values.openldap.bootstrap.ppolicy.groupDnPrefix .Values.openldap.bootstrap.suffix | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY_DEFAULT_MIN_LENGTH: {{ .Values.openldap.bootstrap.ppolicy.default.minLength | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY_DEFAULT_CHECK_QUALITY: {{ .Values.openldap.bootstrap.ppolicy.default.checkQuality | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY_DEFAULT_IN_HISTORY: {{ .Values.openldap.bootstrap.ppolicy.default.inHistory | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY_DEFAULT_ALLOW_USER_CHANGE: {{ ternary "true" "false" .Values.openldap.bootstrap.ppolicy.default.allowUserChange | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY_DEFAULT_SAFE_MODIFY: {{ ternary "true" "false" .Values.openldap.bootstrap.ppolicy.default.safeModify | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY_DEFAULT_MUST_CHANGE: {{ ternary "true" "false" .Values.openldap.bootstrap.ppolicy.default.mustChange | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY_DEFAULT_MIN_AGE: {{ .Values.openldap.bootstrap.ppolicy.default.minAge | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY_DEFAULT_MAX_FAILURE: {{ .Values.openldap.bootstrap.ppolicy.default.maxFailure | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY_DEFAULT_FAILURE_COUNT_INTERVAL: {{ .Values.openldap.bootstrap.ppolicy.default.failureCountInterval | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY_DEFAULT_LOCKOUT: {{ ternary "true" "false" .Values.openldap.bootstrap.ppolicy.default.lockout | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY_DEFAULT_LOCKOUT_DURATION: {{ .Values.openldap.bootstrap.ppolicy.default.lockoutDuration | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY_DEFAULT_MAX_AGE: {{ .Values.openldap.bootstrap.ppolicy.default.maxAge | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY_DEFAULT_EXPIRE_WARNING: {{ .Values.openldap.bootstrap.ppolicy.default.expireWarning | quote }}
  OPENLDAP_BOOTSTRAP_PPOLICY_DEFAULT_GRACE_AUTH_NLIMIT: {{ .Values.openldap.bootstrap.ppolicy.default.graceAuthNLimit | quote }}
  OPENLDAP_BOOTSTRAP_UNIQUE: {{ ternary "true" "false" .Values.openldap.bootstrap.unique.enabled | quote }}
  OPENLDAP_BOOTSTRAP_UNIQUE_URIS: {{ .Values.openldap.bootstrap.unique.uris | quote }}
  OPENLDAP_BOOTSTRAP_MEMBEROF: {{ ternary "true" "false" .Values.openldap.bootstrap.memberof.enabled | quote }}
  OPENLDAP_BOOTSTRAP_MEMBEROF_GROUP_OC: {{ .Values.openldap.bootstrap.memberof.groupObjectClass | quote }}
  OPENLDAP_BOOTSTRAP_MEMBEROF_MEMBER_AD: {{ .Values.openldap.bootstrap.memberof.memberAttribute | quote }}
  OPENLDAP_BOOTSTRAP_MEMBEROF_MEMBEROF_AD: {{ .Values.openldap.bootstrap.memberof.memberOfAttribute | quote }}
  OPENLDAP_BOOTSTRAP_MEMBEROF_ADD_CHECK: {{ ternary "true" "false" .Values.openldap.bootstrap.memberof.addCheck | quote }}
  OPENLDAP_BOOTSTRAP_MEMBEROF_DANGLING: {{ .Values.openldap.bootstrap.memberof.dangling | quote }}
  OPENLDAP_BOOTSTRAP_REPLICATION: {{ ternary "true" "false" $replicationEnabled | quote }}
  {{- if $replicationEnabled }}
  OPENLDAP_BOOTSTRAP_REPLICATION_HOSTS: {{ include "openldap.replicationHosts" . | quote }}
  OPENLDAP_BOOTSTRAP_REPLICATION_SYNCPROV_CHECKPOINT: {{ .Values.openldap.bootstrap.replication.syncprovCheckpoint | quote }}
  OPENLDAP_BOOTSTRAP_REPLICATION_DATA_READONLY_DN: {{ printf "%s,%s" .Values.openldap.bootstrap.replication.dataReadonlyDnPrefix .Values.openldap.bootstrap.suffix | quote }}
  OPENLDAP_BOOTSTRAP_REPLICATION_DATA_READONLY_PASSWORD: {{ .Values.openldap.bootstrap.replication.dataReadonlyPassword | quote }}
  OPENLDAP_BOOTSTRAP_REPLICATION_TLS: {{ ternary "true" "false" .Values.openldap.bootstrap.replication.tls.enabled | quote }}
  OPENLDAP_BOOTSTRAP_REPLICATION_TLS_SYNC_REPL: {{ .Values.openldap.bootstrap.replication.tls.syncRepl | quote }}
  {{- end }}
